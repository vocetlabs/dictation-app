# BENCH1 accuracy runs on GitHub-hosted macOS runners (eval/app_bench/ci/): each app's signed release, set
# up without a person, the clips played into BlackHole, the text read from TextEdit. Accuracy only: the
# runners' speed is not representative. Published: WER counts. Per-clip transcripts leave the runner only
# encrypted to eval/app_bench/ci/results-cert.pem. No keys, no secrets, never a required check.
name: Bench accuracy (macOS runners)

on:
  push:
    branches: [mBENCH1-app-bench]
    paths:
      - "eval/app_bench/ci/**"
      - ".github/workflows/bench-accuracy.yml"

permissions:
  contents: read

jobs:
  shard:
    name: ${{ matrix.app }} ${{ matrix.shard }}/4
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [handy]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run
        run: eval/app_bench/ci/run_shard.sh "${{ matrix.app }}" "${{ matrix.shard }}/4"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.app }}-${{ matrix.shard }}
          path: |
            eval/app_bench/out/wer.json
            eval/app_bench/out/app.txt
            eval/app_bench/out/results.csv.cms
          if-no-files-found: warn

  summary:
    name: WER summary
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: shards
      - name: Sum
        run: |
          for app in $(ls shards | sed -n 's/^bench-\(.*\)-[0-9]*$/\1/p' | sort -u); do
            echo "## $app" >>"$GITHUB_STEP_SUMMARY"
            python3 eval/app_bench/harness.py wer-sum shards/bench-"$app"-*/wer.json | tee -a "$GITHUB_STEP_SUMMARY"
          done
