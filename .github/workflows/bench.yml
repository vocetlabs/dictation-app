# The dictation-app bench (eval/app_bench) on GitHub-hosted macOS runners: one job per app, the app's
# signed release (or source build) set up without a person, a synthetic smoke dictation as the gate, then
# (full) all clips, scored in the job. Accuracy only: a runner's speed is not representative. Uploads
# numbers only (score.json, run.json, judge.json): never audio, references or transcripts. Never a
# required check.
#
# A push runs eval/app_bench/ci-plan.json; a manual run (once this file is on a default branch) picks the
# app and size. The judge step computes ZER/AMEND only if a JUDGE_API_KEY secret is passed to it (the
# bench's own repository; this repository has no secrets) and says "not computed (no key)" otherwise.
name: Bench

on:
  push:
    branches: [mBENCH1-app-bench]
    paths:
      - "eval/app_bench/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      app:
        description: App (apps/<app>.json with hosted_setup true)
        type: choice
        options: [handy, muesli, fluidvoice, vocet]
      size:
        description: smoke (one synthetic dictation) or full (all clips)
        type: choice
        options: [smoke, full]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      size: ${{ steps.plan.outputs.size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          APP: ${{ inputs.app }}
          SIZE: ${{ inputs.size }}
        run: |
          if [ -n "$APP" ]; then
            echo "apps=[\"$APP\"]" >>"$GITHUB_OUTPUT"
            echo "size=$SIZE" >>"$GITHUB_OUTPUT"
          else
            python3 -c 'import json; p = json.load(open("eval/app_bench/ci-plan.json")); print("apps=" + json.dumps(p["apps"])); print("size=" + p["size"])' >>"$GITHUB_OUTPUT"
          fi

  bench:
    needs: plan
    name: ${{ matrix.app }} ${{ needs.plan.outputs.size }}
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      SIZE: ${{ needs.plan.outputs.size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Machine
        working-directory: eval/app_bench
        run: |
          command -v uv >/dev/null || brew install --quiet uv
          ./bench machine --ci
      - name: App
        working-directory: eval/app_bench
        run: |
          ./bench setup --app "$APP" --ci
          ./bench windows
      - name: Clips
        if: env.SIZE == 'full'
        working-directory: eval/app_bench
        run: ./bench fetch
      - name: Run
        working-directory: eval/app_bench
        run: ./bench run --app "$APP" "--$SIZE" --accuracy-only --machine github-macos-15 -o out/run
      - name: Judge
        if: env.SIZE == 'full'
        working-directory: eval/app_bench
        run: ./bench judge out/run
      - name: Summary
        if: always() && env.SIZE == 'full'
        working-directory: eval/app_bench
        run: |
          [ -f out/run/score.json ] || { echo "no score.json" >>"$GITHUB_STEP_SUMMARY"; exit 1; }
          ./bench verify out/run/score.json
          ./bench table out/run/score.json >>"$GITHUB_STEP_SUMMARY"
      - name: Upload numbers
        if: always() && env.SIZE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ env.APP }}
          path: |
            eval/app_bench/out/run/score.json
            eval/app_bench/out/run/run.json
            eval/app_bench/out/run/judge.json
          if-no-files-found: warn
